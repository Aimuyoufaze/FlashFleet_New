<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极速车队 — 管理信息系统</title>
<link rel="stylesheet" href="/css/fleet.css">
</head>
<body>

<div class="landing">
  <img src="/assets/flash-fleet-logo.png" alt="Flash Fleet 极速车队" style="height:72px;margin-bottom:16px;">
  <h1>极速车队</h1>
  <p class="subtitle">Speed Fleet Management System</p>

  <div class="role-grid">
    <a href="/driver" class="role-card driver">
      <div class="icon"><img src="/assets/flash-fleet-driver.png" alt="司机端" class="icon-img"></div>
      <h2>司机端</h2>
      <p>回单上传 · 一键报修 · 进度追踪</p>
      <div class="mt-16">
        <span class="badge badge-green">赵师傅视角</span>
      </div>
    </a>
    <a href="/dispatcher" class="role-card dispatcher">
      <div class="icon"><img src="/assets/flash-fleet-dispatch.png" alt="调度端" class="icon-img"></div>
      <h2>调度端</h2>
      <p>车辆看板 · 审批管理 · 运营总览</p>
      <div class="mt-16">
        <span class="badge badge-blue">王姐视角</span>
      </div>
    </a>
    <a href="/boss" class="role-card boss">
      <div class="icon"><img src="/assets/flash-fleet-boss.png" alt="老板端" class="icon-img"></div>
      <h2>老板端</h2>
      <p>财务报表 · 收支明细 · 利润分析</p>
      <div class="mt-16">
        <span class="badge badge-amber">李老板视角</span>
      </div>
    </a>
  </div>

  <p style="margin-top:40px;font-size:12px;color:var(--text-muted);">
    极速车队管理信息系统 v1.0 · 全功能原型
  </p>
  <button onclick="resetSystem()" style="margin-top:12px;padding:6px 18px;font-size:12px;border:1px solid #d1d5db;border-radius:99px;background:#fff;color:#9ca3af;cursor:pointer;transition:all .15s;"
    onmouseover="this.style.borderColor='#ef4444';this.style.color='#ef4444'"
    onmouseout="this.style.borderColor='#d1d5db';this.style.color='#9ca3af'"
  >🔄 重置为初始状态</button>
</div>

<script>
async function resetSystem() {
  if (!confirm('确定要重置为初始状态吗？\n\n这将清除所有报修记录、派单记录和财务数据。')) return;
  try {
    const res = await fetch('/api/reset', { method: 'POST' });
    const data = await res.json();
    alert('✅ ' + data.message);
  } catch(e) {
    alert('重置失败，请检查服务器是否运行');
  }
}
</script>
</body>
</html>
